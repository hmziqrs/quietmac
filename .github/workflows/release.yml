name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish ${{ github.ref_name }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches quietmac.__version__
        run: |
          v=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('quietmac/__init__.py').read()).group(1))")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $v"
            exit 1
          fi
      - name: Build the archive
        run: |
          name="quietmac-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: quietmac-*.tar.gz
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" quietmac-*.tar.gz quietmac-*.tar.gz.sha256 \
            --title "quietmac $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
